<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shattered Arcana — Pose Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #eee; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
  #viewport { width: 100vw; height: calc(100vh - 120px); display: block; }
  #toolbar {
    height: 60px; background: #16213e; display: flex; align-items: center;
    padding: 0 20px; gap: 12px; border-top: 1px solid #0f3460;
  }
  #timeline {
    height: 60px; background: #0f3460; display: flex; align-items: center;
    padding: 0 20px; gap: 8px; border-top: 1px solid #533483;
  }
  button {
    background: #533483; color: #eee; border: none; padding: 8px 16px;
    border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #6a4c93; }
  button.active { background: #e94560; }
  #bone-label {
    background: #0f3460; padding: 6px 14px; border-radius: 4px;
    min-width: 180px; text-align: center; font-size: 13px;
  }
  #frame-display {
    background: #533483; padding: 6px 14px; border-radius: 4px;
    font-weight: bold; font-size: 15px; min-width: 120px; text-align: center;
  }
  #frame-slider { flex: 1; accent-color: #e94560; }
  #status { font-size: 12px; color: #aaa; margin-left: auto; }
  .bone-list {
    position: absolute; top: 10px; right: 10px; background: rgba(15,52,96,0.9);
    border-radius: 8px; padding: 10px; max-height: calc(100vh - 140px);
    overflow-y: auto; width: 220px; font-size: 12px;
  }
  .bone-list div { padding: 4px 8px; cursor: pointer; border-radius: 3px; }
  .bone-list div:hover { background: rgba(83,52,131,0.6); }
  .bone-list div.selected { background: #e94560; color: white; }
  #rotation-controls {
    position: absolute; bottom: 130px; left: 10px; background: rgba(15,52,96,0.9);
    border-radius: 8px; padding: 12px; width: 240px;
  }
  .rot-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .rot-row label { width: 20px; font-weight: bold; font-size: 14px; }
  .rot-row input[type=range] { flex: 1; accent-color: #e94560; }
  .rot-row span { width: 50px; text-align: right; font-size: 12px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<canvas id="viewport"></canvas>

<div class="bone-list" id="bone-list"></div>

<div id="rotation-controls">
  <div style="font-weight:bold; margin-bottom:8px;">Bone Rotation</div>
  <div class="rot-row">
    <label>X</label>
    <input type="range" id="rot-x" min="-180" max="180" value="0" step="0.5">
    <span id="rot-x-val">0.0</span>
  </div>
  <div class="rot-row">
    <label>Y</label>
    <input type="range" id="rot-y" min="-180" max="180" value="0" step="0.5">
    <span id="rot-y-val">0.0</span>
  </div>
  <div class="rot-row">
    <label>Z</label>
    <input type="range" id="rot-z" min="-180" max="180" value="0" step="0.5">
    <span id="rot-z-val">0.0</span>
  </div>
  <div style="margin-top:8px;">
    <button id="btn-reset-bone">Reset Bone</button>
    <button id="btn-undo">Undo</button>
    <button id="btn-redo">Redo</button>
  </div>
</div>

<div id="toolbar">
  <button id="btn-prev-frame">&#9664; Prev</button>
  <div id="frame-display">Frame 1 / 360</div>
  <button id="btn-next-frame">Next &#9654;</button>
  <button id="btn-set-key">Set Keyframe</button>
  <button id="btn-del-key">Del Key</button>
  <button id="btn-play">&#9654; Play</button>
  <div id="bone-label">No bone selected</div>
  <div id="status">Loading...</div>
</div>

<div id="timeline">
  <span style="font-size:12px;">1</span>
  <input type="range" id="frame-slider" min="1" max="360" value="1">
  <span style="font-size:12px;">360</span>
  <button id="btn-export">Export JSON</button>
  <button id="btn-import">Import JSON</button>
</div>

<script type="module">
// ============================================================
// IMPORTS — thin shell wiring modules to UI
// ============================================================
import { THREE, canvas, camera, controls, renderer, scene, boneHelperGroup, registerUpdatable, animate } from './js/core.js';
import * as rig from './js/rig.js';
import * as kfe from './js/keyframe-engine.js';
import './js/api.js';  // registers all window.* functions
import './js/knight-standalone.js';  // self-contained SDF knight

const statusEl = document.getElementById('status');

// ============================================================
// LOAD MODEL — Standalone SDF knight (no FBX dependency)
// ============================================================
statusEl.textContent = 'Building knight...';

// Build the SDF knight directly — no Mixamo model needed.
// The FBX load is kept as a fallback if buildStandaloneKnight isn't available yet.
setTimeout(() => {
  if (window.buildStandaloneKnight) {
    const boneCount = window.buildStandaloneKnight({
      resolution: 72,
      steelColor: 0xc8d0dc,
      goldColor: 0xf0c040,
    });
    if (boneCount > 0) {
      buildBoneList();
      statusEl.textContent = `SDF Knight: ${boneCount} bones. Click bone to select.`;
      // Signal model ready for Playwright automation
      window._modelReady = true;
      return;
    }
  }
  // Fallback: load FBX model
  statusEl.textContent = 'Loading FBX fallback...';
  rig.loadModel('/model/Knight D Pelegrini.fbx').then(({ boneCount }) => {
    buildBoneList();
    statusEl.textContent = `Loaded: ${boneCount} bones. Click bone to select, right-drag to rotate.`;
  }).catch(err => {
    statusEl.textContent = `Error: ${err.message}`;
    console.error(err);
  });
}, 100);

// Register bone visual updates in render loop
registerUpdatable(() => rig.updateBoneVisuals());

// Playback tick
let lastPlayTime = 0;
registerUpdatable((dt) => {
  if (!kfe.getIsPlaying()) return;
  const now = performance.now();
  if (now - lastPlayTime > 1000 / kfe.getFPS()) {
    const next = kfe.getCurrentFrame() + 1;
    window.goToFrame(next > kfe.getTotalFrames() ? 1 : next);
    lastPlayTime = now;
  }
});

// Mixer update for clip playback
registerUpdatable((dt) => {
  const mixer = rig.getMixer();
  if (mixer) mixer.update(dt);
});

// ============================================================
// BONE LIST UI
// ============================================================
function buildBoneList() {
  const el = document.getElementById('bone-list');
  el.innerHTML = '<div style="font-weight:bold;padding:4px 8px;margin-bottom:4px;">Bones</div>';

  // Use standalone knight bones if available, otherwise rig.js bones
  let boneNames = [];
  if (window.knightGetBoneNames) {
    boneNames = window.knightGetBoneNames();
  }
  if (boneNames.length === 0) {
    boneNames = [...new Set(rig.getBones().map(b => b.name))];
  }

  // For standalone knight, all bones are important
  const important = rig.getBones().filter(b => {
    const n = b.name.toLowerCase();
    return n.includes('spine') || n.includes('arm') || n.includes('hand') ||
      n.includes('head') || n.includes('neck') || n.includes('hip') ||
      n.includes('leg') || n.includes('foot') || n.includes('shoulder') ||
      n.includes('thigh') || n.includes('calf') || n.includes('toe') ||
      n.includes('chest') || n.includes('upper');
  });
  // Deduplicate
  const seen = new Set();
  const unique = (important.length > 0 ? important : rig.getBones()).filter(b => {
    if (seen.has(b.name)) return false;
    seen.add(b.name);
    return true;
  });
  unique.forEach(bone => {
    const div = document.createElement('div');
    div.textContent = bone.name;
    div.dataset.bone = bone.name;
    div.addEventListener('click', () => {
      rig.selectBone(bone.name);
      refreshBoneUI(bone.name);
    });
    el.appendChild(div);
  });
}

function refreshBoneUI(boneName) {
  document.getElementById('bone-label').textContent = boneName;
  document.querySelectorAll('#bone-list div').forEach(el => {
    el.classList.toggle('selected', el.dataset.bone === boneName);
  });
  const rot = rig.getBoneRotation(boneName);
  if (rot) {
    document.getElementById('rot-x').value = rot.x;
    document.getElementById('rot-y').value = rot.y;
    document.getElementById('rot-z').value = rot.z;
    document.getElementById('rot-x-val').textContent = rot.x.toFixed(1);
    document.getElementById('rot-y-val').textContent = rot.y.toFixed(1);
    document.getElementById('rot-z-val').textContent = rot.z.toFixed(1);
  }
}

// ============================================================
// BONE CLICK SELECTION (raycaster)
// ============================================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(Object.values(rig.boneSpheres));
  if (hits.length > 0) {
    const name = hits[0].object.userData.boneName;
    rig.selectBone(name);
    refreshBoneUI(name);
  }
});

// ============================================================
// ROTATION SLIDERS
// ============================================================
['x', 'y', 'z'].forEach(axis => {
  document.getElementById(`rot-${axis}`).addEventListener('input', (e) => {
    const sel = rig.getSelectedBone();
    if (!sel) return;
    const deg = parseFloat(e.target.value);
    document.getElementById(`rot-${axis}-val`).textContent = deg.toFixed(1);
    const cur = rig.getBoneRotation(sel);
    if (cur) {
      const rx = axis === 'x' ? deg : cur.x;
      const ry = axis === 'y' ? deg : cur.y;
      const rz = axis === 'z' ? deg : cur.z;
      window.setBoneRotation(sel, rx, ry, rz);
    }
  });
});

// ============================================================
// RIGHT-CLICK DRAG TO ROTATE
// ============================================================
let isDragging = false, dragStartX = 0, dragStartY = 0, dragStart = null;

canvas.addEventListener('mousedown', (e) => {
  const sel = rig.getSelectedBone();
  if (!sel || e.button !== 2) return;
  e.preventDefault();
  isDragging = true;
  dragStartX = e.clientX; dragStartY = e.clientY;
  dragStart = rig.getBoneRotation(sel);
  controls.enabled = false;
});

canvas.addEventListener('mousemove', (e) => {
  if (!isDragging || !dragStart) return;
  const sel = rig.getSelectedBone();
  if (!sel) return;
  const dx = (e.clientX - dragStartX) * 0.5;
  const dy = (e.clientY - dragStartY) * 0.5;
  rig.setBoneRotation(sel, dragStart.x + dy, dragStart.y + dx, dragStart.z);
  refreshBoneUI(sel);
});

window.addEventListener('mouseup', () => {
  if (isDragging) { isDragging = false; controls.enabled = true; }
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// ============================================================
// BUTTONS
// ============================================================
document.getElementById('btn-prev-frame').addEventListener('click', () => window.goToFrame(kfe.getCurrentFrame() - 1));
document.getElementById('btn-next-frame').addEventListener('click', () => window.goToFrame(kfe.getCurrentFrame() + 1));
document.getElementById('frame-slider').addEventListener('input', (e) => window.goToFrame(parseInt(e.target.value)));
document.getElementById('btn-set-key').addEventListener('click', () => {
  const result = window.setKeyframe(rig.getSelectedBone());
  statusEl.textContent = `Keyframe: ${result}`;
});
document.getElementById('btn-del-key').addEventListener('click', () => window.deleteKeyframe(rig.getSelectedBone()));
document.getElementById('btn-play').addEventListener('click', () => {
  kfe.setIsPlaying(!kfe.getIsPlaying());
  document.getElementById('btn-play').textContent = kfe.getIsPlaying() ? '|| Pause' : '> Play';
});
document.getElementById('btn-reset-bone').addEventListener('click', () => {
  const sel = rig.getSelectedBone();
  if (sel) { rig.resetBone(sel); refreshBoneUI(sel); }
});
document.getElementById('btn-undo').addEventListener('click', () => window.undo());
document.getElementById('btn-redo').addEventListener('click', () => window.redo());

// Export / Import
document.getElementById('btn-export').addEventListener('click', () => {
  const data = JSON.stringify({
    fps: kfe.getFPS(), totalFrames: kfe.getTotalFrames(),
    keyframes: JSON.parse(kfe.exportJSON()),
    camera: JSON.parse(window.getCameraKeyframes ? window.getCameraKeyframes() : '{}'),
    restPose: rig.getRestPose(),
  }, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = 'animation-keyframes.json';
  a.click();
});

document.getElementById('btn-import').addEventListener('click', () => {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = (e) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const data = JSON.parse(ev.target.result);
      if (data.keyframes) window.importKeyframes(JSON.stringify(data.keyframes));
      if (data.camera) window.importCameraKeyframes(JSON.stringify(data.camera));
      window.goToFrame(1);
      statusEl.textContent = 'Imported keyframes';
    };
    reader.readAsText(e.target.files[0]);
  };
  input.click();
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') window.goToFrame(kfe.getCurrentFrame() + 1);
  if (e.key === 'ArrowLeft') window.goToFrame(kfe.getCurrentFrame() - 1);
  if (e.key === 'k' || e.key === 'K') window.setKeyframeAll();
  if (e.key === 'z' && e.ctrlKey) { e.preventDefault(); window.undo(); }
  if (e.key === 'y' && e.ctrlKey) { e.preventDefault(); window.redo(); }
  if (e.key === ' ') {
    e.preventDefault();
    kfe.setIsPlaying(!kfe.getIsPlaying());
    document.getElementById('btn-play').textContent = kfe.getIsPlaying() ? '|| Pause' : '> Play';
  }
});

// ============================================================
// START
// ============================================================
animate();
</script>
</body>
</html>
